# DRAFT - Cloud Run service for the public read-only website (deploy/gcp/README.md, step 7).
# Replace the tokens __PROJECT_ID__, __REGION__, __BUCKET__ and __TAG__ (README.md,
# step 7 renders them with sed), then:
#   gcloud run services replace deploy/gcp/service.rendered.yaml --region=REGION
# The same settings as gcloud flags are in README.md, step 7 (alternative).
#
# Public access: the annotation run.googleapis.com/invoker-iam-disabled below
# (Google's recommended way, and it works under the domain-restricted-sharing org
# policy). If you prefer the allUsers binding instead, delete that annotation and
# run README.md step 7b. `services replace` sets no IAM bindings by itself.
# Setting the annotation needs run.services.setIamPolicy (the project owner has
# it) and is rejected if the org policy run.managed.requireInvokerIam is
# enforced (README.md step 0). Firebase Hosting (README.md step 10) reaches
# the service as an anonymous caller, so the service must stay public this way.
#
# No SCOUT_WEB_ADDR: in gcs mode the program listens on :$PORT, which Cloud Run
# sets from containerPort (8080).
#
# Security headers (CSP, nosniff, frame-ancestors, referrer policy) are set by
# the Go server (webSecurityHeaders in web.go), not here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: scout-web
  labels:
    app: scout-web
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        app: scout-web
      annotations:
        # Owner decision (9 Oct 2026): 0 = scale to zero, cold start accepted.
        # The first visitor after an idle period waits for a cold start (start +
        # first snapshot download, estimated 1-3 s, not measured). 1 would be
        # about $10/month with request-based billing (README.md, "Costs").
        autoscaling.knative.dev/minScale: "0"
        # small cap: bounds the bill if the site is hammered (each instance then
        # serves up to containerConcurrency requests at once; extra requests queue
        # and may get 429)
        autoscaling.knative.dev/maxScale: "3"
        # request-based billing: CPU only while a request is being handled. The
        # GCS mode therefore checks for a new snapshot inside a request, which
        # waits for the whole check (bounded at 10 s; INTERFACE.md 5.2).
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: scout-web-run@__PROJECT_ID__.iam.gserviceaccount.com
      # the API answers from memory in milliseconds; 80 is Cloud Run's default
      containerConcurrency: 80
      # no long-lived requests (SCOUT_WEB_EVENTS=off): a short timeout is enough
      timeoutSeconds: 30
      containers:
        - name: web
          image: __REGION__-docker.pkg.dev/__PROJECT_ID__/scout/scout-web:__TAG__
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SCOUT_WEB_SOURCE
              value: gcs
            - name: SCOUT_WEB_GCS_BUCKET
              value: __BUCKET__
            - name: SCOUT_WEB_GCS_OBJECT
              value: public/current.json
            - name: SCOUT_WEB_GCS_POLL
              value: 15s
            - name: SCOUT_WEB_EVENTS
              value: "off"
            # optional; the built-in default is https://gmgn.ai/robinhood/token/{ca}
            # - name: SCOUT_GMGN_URL
            #   value: https://gmgn.ai/robinhood/token/{ca}
          resources:
            limits:
              # 1 vCPU: below 1 vCPU Cloud Run forces concurrency 1
              # (https://cloud.google.com/run/docs/configuring/services/cpu).
              cpu: "1"
              # snapshot of ~10k rows (1-2 MB gzip) is tens of MB in memory with
              # its indexes and answer caches; 512Mi leaves room. Lower to 256Mi
              # only after measuring.
              memory: 512Mi
          # Traffic reaches a new instance only once this answers 200, i.e. after
          # the first snapshot is loaded (no 503 to visitors on a cold start).
          # 30 x 2 s = up to 60 s for the first download. No liveness probe: a
          # stale snapshot is not fixed by a restart, and /api/health reports it.
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

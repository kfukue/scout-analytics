# DRAFT - review before installing. Drop-in for the prod scout-web.service
# (DEPLOY.md section 4) that turns on the GCS export (deploy/gcp/INTERFACE.md).
# Install as:
#   /etc/systemd/system/scout-web.service.d/gcp-export.conf
# then: sudo systemctl daemon-reload && sudo systemctl restart scout-web
# Remove the file (and daemon-reload, restart) to turn the export off again.
#
# Needs the Go export mode first; an older binary ignores these variables.
# The export never blocks or stops the website: if GCS or the credential fails,
# the prod site keeps serving and the export retries with backoff.

[Service]
# Non-secret settings (bucket name, object names, link hosts).
EnvironmentFile=/etc/scoutanalytics/web-export.env

# Credential of scout-web-export@PROJECT_ID (deploy/gcp/README.md, step 4):
#   option (a) SA key file (chosen, owner decision 9 Oct 2026), or
#   option (b), alternative: X.509 Workload Identity Federation credential config (same
#              variable; that JSON names the certificate files, holds no key).
# File: owner root, group scout, mode 0640: the service user can read it but
# not rewrite it. Directory /etc/scoutanalytics: root:scout 0750.
# Never in the repo or the working directory.
Environment=GOOGLE_APPLICATION_CREDENTIALS=/etc/scoutanalytics/gcp-export.json

# Hardening alternative (verify on the server's systemd version first, 247+):
# keep the key root:root 0600 and hand it to the service only, via systemd
# credentials (comment out the Environment= line above):
#LoadCredential=gcp-export.json:/etc/scoutanalytics/gcp-export.json
#Environment=GOOGLE_APPLICATION_CREDENTIALS=%d/gcp-export.json

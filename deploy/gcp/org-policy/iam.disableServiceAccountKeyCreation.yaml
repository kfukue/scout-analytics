# DRAFT - project-level exception to the org policy iam.disableServiceAccountKeyCreation
# (deploy/gcp/README.md, step 0 / step 4 option a). Apply ONLY if step 0 shows the
# constraint as enforced: enforce:false on a constraint the organisation does not
# enforce yet pins this project as exempt from a later org-wide enforcement.
# Render __PROJECT_ID__, then:
#   gcloud org-policies set-policy deploy/gcp/org-policy/iam.disableServiceAccountKeyCreation.rendered.yaml
# Undo (back to whatever the organisation sets):
#   gcloud org-policies delete iam.disableServiceAccountKeyCreation --project=PROJECT_ID
# Needs roles/orgpolicy.policyAdmin on the organisation.
name: projects/__PROJECT_ID__/policies/iam.disableServiceAccountKeyCreation
spec:
  rules:
    - enforce: false
